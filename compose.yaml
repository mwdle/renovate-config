name: Renovate
services:
  Renovate:
    image: renovate/renovate:43.103@sha256:5ee632f9a617933125fa8ee962482bacc787160a2b5d959c50e0b8b2ef6a94a0
    container_name: Renovate
    restart: no
    hostname: renovate
    networks:
      Renovate:
    volumes:
      - renovate_cache:/tmp/renovate/cache
      - renovate_repos:/tmp/renovate/repos
    environment:
      RENOVATE_PLATFORM: gitea
      RENOVATE_ENDPOINT: https://${GITEA_HOSTNAME}/api/v1
      RENOVATE_TOKEN: ${GITEA_TOKEN}
      RENOVATE_AUTODISCOVER: true
      RENOVATE_AUTODISCOVER_FILTER: ${GIT_REPO:-${GITEA_ORG}/*}
      RENOVATE_ONBOARDING_CONFIG: '{"extends": ["local>${GITEA_ORG}/renovate-config"]}'
      RENOVATE_GITHUB_COM_TOKEN: ${GITHUB_TOKEN}

    user: "${UID}:${GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: journald

    deploy:
      resources:
        limits:
          cpus: 1.5
          memory: 2GB
          pids: 50

networks:
  Renovate:
    external: true

volumes:
  renovate_cache:
  renovate_repos:
